name: PHP syntax validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Validate PHP sources
        run: |
          set -e
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
