services:
  postgres:
    image: postgres:16-alpine
    container_name: familia-almeida-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: familia_almeida
      POSTGRES_USER: familia
      POSTGRES_PASSWORD: familia_dev
    ports:
      - "5432:5432"
    volumes:
      - familia_almeida_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familia -d familia_almeida"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  familia_almeida_pgdata:
